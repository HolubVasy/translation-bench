# Translation benchmark configuration.
# Verify exact OpenRouter model ids at openrouter.ai before the first run.

translators:
  M2: google/gemini-4-argon
  M5: openai/gpt-6-luna-pro
  M6: google/gemini-3.8-flash
  M7: openai/gpt-6-sol-pro
  M8: anthropic/claude-opus-5.5

judges:
  J1: anthropic/claude-opus-5.5   # swap to anthropic/claude-fable-5.1 if preferred
  # J2: openai/gpt-6-astra-pro   # off: one judgment cost 4.58 USD (issue #53)
  J3: google/gemini-4-argon       # also a participant (M2); aggregate.py reports its self-scores separately
  J4: openai/gpt-6-luna-pro       # OpenAI voice; replaced by openai/gpt-6-sol if it fails calibration

# USD per 1M tokens, input/output. Used only for the cost column in the report.
prices:
  M2: {input: 2.00, output: 10.00}   # launch discount until 30 Nov 2026, list price 4.00 / 20.00
  M5: {input: 0.10, output: 0.50}
  M6: {input: 0.83, output: 4.12}
  M7: {input: 2.00, output: 10.00}
  M8: {input: 4.00, output: 20.00}

judge_prices:
  J1: {input: 4.00, output: 20.00}
  # J2: {input: 10.00, output: 50.00}   # Astra Pro, off
  J3: {input: 2.00, output: 10.00}
  J4: {input: 0.10, output: 0.50}

# Judge calibration: a copy of one real translation with planted errors, one
# per kind listed below (src/calibrate.py PLANTERS). A judge flagging fewer
# than min_caught planted segments is left out of the overall tables.
calibration:
  enabled: true
  article: a1
  base_translator: M2
  label: M9          # neutral blind label, must not clash with a translator code
  min_caught: 3
  kinds: [negation, number, omission, modality, quantifier]

# PDF conversion (src/convert.py): the article ends at these headings.
convert:
  stop_at: [references, bibliography, literature cited]

# Deterministic gates (src/mech_check.py). A translation outside these limits
# is disqualified before any judge sees it.
gates:
  length_ratio: {min: 0.6, max: 1.8}   # target words / source words
  max_source_script_chars: 40          # residue units allowed: Cyrillic chars (RU source) or English function words (EN source)
  max_glossary_violations: 3

# Optional glossary of terms the translation must use (see glossary.example.yaml).
# glossary: glossary.yaml

judging:
  double_pass: false                   # second pass in reversed order; off for the long-article run to fit the key budget

# Preflight estimate and budget guard (src/preflight.py).
budget:
  max_usd: 10.0
  tokens_per_char: 0.35
  prompt_overhead_tokens: 600
  judge_output_tokens: 1500

source_lang: English
target_lang: Russian

request:
  temperature: 0.0
  max_retries: 3
  timeout_sec: 900
  max_tokens: 64000   # long articles; Gemini caps output at 65536

# Optional second pass: a base translation proofread by another model.
# List each hybrid code in translators too (with the proofreader's model id),
# so it is judged like any translator; src.translate skips it, src.refine writes it.
# hybrids:
#   H1: {base: M7, model: openai/gpt-6-luna-pro, source: false}
#   H2: {base: M7, model: openai/gpt-6-luna-pro, source: true}
