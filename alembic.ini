# Alembic configuration for the Translator interview schema (AB#300).
#
# There is deliberately no sqlalchemy.url here. env.py reads DATABASE_URL
# from the environment, so no connection string and no password can reach
# git, which is the same rule the OpenRouter key follows.
#
# Usage, from the repository root with DATABASE_URL exported:
#   alembic upgrade head      apply everything not applied yet
#   alembic current           which revision the database is on
#   alembic downgrade base    undo back to an empty database
#   alembic upgrade head --sql    print the SQL instead of running it

[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
version_path_separator = os
