# Terms the translation must use. Copy to glossary.yaml and point
# config.yaml `glossary:` at it. Source is matched case-insensitively as a
# substring; any of the target forms counts. Source terms may be written
# with YAML \u escapes (as below) to keep the file ASCII, or in plain
# Cyrillic in your own glossary.yaml.
terms:
  - source: "\u0442\u0430\u043c\u043e\u0436\u0435\u043d\u043d\u0430\u044f \u0434\u0435\u043a\u043b\u0430\u0440\u0430\u0446\u0438\u044f"
    target: ["customs declaration"]
  - source: "\u0434\u0435\u043a\u043b\u0430\u0440\u0430\u043d\u0442"
    target: ["declarant"]
  - source: "\u0442\u0430\u043c\u043e\u0436\u0435\u043d\u043d\u044b\u0439 \u043e\u0440\u0433\u0430\u043d"
    target: ["customs authority", "customs authorities"]
